name: LogStream CI/CD

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:

  # ─────────────────────────────────────────────────────────
  # JOB 1: Backend — Build & Test
  # ─────────────────────────────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logstream
          POSTGRES_USER: logstream
          POSTGRES_PASSWORD: logstream123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logstream -d logstream"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Run init SQL on PostgreSQL
        run: |
          PGPASSWORD=logstream123 psql \
            -h localhost -U logstream -d logstream \
            -f "$GITHUB_WORKSPACE/data-engineering/db/ddl/schema_ddl.sql"

      - name: Build with Maven
        working-directory: backend
        run: mvn clean install -DskipTests -B

      - name: Run Backend Tests
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/logstream
          SPRING_DATASOURCE_USERNAME: logstream
          SPRING_DATASOURCE_PASSWORD: logstream123
          JWT_SECRET: logstream-secret-key-amalitech-2024-secure
        run: mvn test -B

  # ─────────────────────────────────────────────────────────
  # JOB 2: Data Engineering — Install & Test
  # ─────────────────────────────────────────────────────────
  data-engineering:
    name: Data Engineering — Install & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logstream
          POSTGRES_USER: logstream
          POSTGRES_PASSWORD: logstream123
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U logstream -d logstream"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: data-engineering/requirements.txt

      - name: Install dependencies
        working-directory: data-engineering
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Run init SQL on PostgreSQL
        run: |
          PGPASSWORD=logstream123 psql \
            -h localhost -p 5433 -U logstream -d logstream \
            -f "$GITHUB_WORKSPACE/data-engineering/db/ddl/schema_ddl.sql"

      - name: Run Data Engineering Tests
        working-directory: data-engineering
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: logstream
          DB_USER: logstream
          DB_PASSWORD: logstream123
          PYTHONPATH: .
        run: python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────
  # JOB 3: Docker — Build All Images
  # Runs only after both jobs pass
  # ─────────────────────────────────────────────────────────
  docker:
    name: Docker — Build All Images
    runs-on: ubuntu-latest
    needs: [ backend, data-engineering ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          push: false
          tags: logstream-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build data-engineering image
        uses: docker/build-push-action@v6
        with:
          context: data-engineering
          file: data-engineering/Dockerfile
          load: true
          push: false
          tags: logstream-data-engineering:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker images exist
        run: docker images | grep logstream